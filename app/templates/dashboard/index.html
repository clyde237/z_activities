{% extends "base.html" %}
{% block title %}Tableau de bord{% endblock %}
{% block content %}
<div class="w-full max-w-lg space-y-4 bg-white p-8 rounded-xl shadow">
  <h1 class="text-xl font-semibold">Bienvenue, {{ user.full_name }}</h1>
  <p class="text-sm text-slate-600">Rôle : {{ user.role.value }}</p>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <button type="submit" class="rounded-md bg-slate-900 text-white px-4 py-2 text-sm font-medium">
      Se déconnecter
    </button>
  </form>
</div>
{% endblock %}
