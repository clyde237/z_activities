{% extends "base.html" %}
{% block title %}Connexion - Z_Activités{% endblock %}
{% block auth_box %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
  <div class="flex justify-center">
    <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/30">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="13" width="4" height="8" rx="1.5" />
        <rect x="10" y="8" width="4" height="13" rx="1.5" />
        <rect x="17" y="3" width="4" height="18" rx="1.5" />
      </svg>
    </div>
  </div>
  <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-slate-900">
    Z_Activités
  </h2>
  <p class="mt-1 text-center text-sm text-slate-500">
    Plateforme de suivi des activités et de la performance
  </p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
  <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl sm:px-10 border border-slate-100">
    <form method="post" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div>
        <label for="username" class="block text-sm font-semibold text-slate-700">
          Identifiant utilisateur
        </label>
        <div class="mt-1.5 relative">
          <input id="username" name="username" type="text" required autofocus
                 class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-sm transition-all"
                 placeholder="ex: marie.laurent">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700">
          Mot de passe
        </label>
        <div class="mt-1.5 relative">
          <input id="password" name="password" type="password" required
                 class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-sm transition-all"
                 placeholder="••••••••">
        </div>
      </div>

      <div>
        <button type="submit"
                class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          Se connecter
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
