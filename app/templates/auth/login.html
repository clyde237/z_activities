{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<form method="post" class="w-full max-w-sm space-y-4 bg-white p-8 rounded-xl shadow">
  <h1 class="text-xl font-semibold">Connexion</h1>
  <div>
    <label class="block text-sm font-medium mb-1" for="username">Identifiant</label>
    <input id="username" name="username" type="text" required autofocus
           class="w-full rounded-md border border-slate-300 px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required
           class="w-full rounded-md border border-slate-300 px-3 py-2">
  </div>
  <button type="submit" class="w-full rounded-md bg-slate-900 text-white py-2 font-medium">
    Se connecter
  </button>
</form>
{% endblock %}
